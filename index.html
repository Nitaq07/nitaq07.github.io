<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة رفع البيانات - النطاق السابع</title>
<meta name="description" content="منصة رفع البيانات النطاق السابع - 1448هـ">
<meta name="theme-color" content="#0f5c4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رفع البيانات">
<style>
  :root { --green:#0f5c4a; --gold:#d4af37; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--green); overflow:hidden; }
  body { font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif; }

  /* إطار التطبيق — يملأ الشاشة ويراعي حواف الآيفون */
  #app {
    position:fixed; inset:0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:#fff;
  }
  #app iframe { width:100%; height:100%; border:0; display:block; background:#fff; }

  /* شاشة البدء */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background: radial-gradient(circle at 50% 40%, #16735d 0%, var(--green) 70%);
    color:#fff; text-align:center; padding:24px;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #splash.hide { opacity:0; visibility:hidden; }
  #splash img { width:112px; height:112px; border-radius:26px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  #splash h1 { font-size:21px; font-weight:700; line-height:1.5; }
  #splash p  { font-size:14px; opacity:.85; }
  .bar { width:150px; height:4px; border-radius:4px; background:rgba(255,255,255,.2); overflow:hidden; }
  .bar span { display:block; width:40%; height:100%; background:var(--gold); border-radius:4px;
              animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(160%)} 100%{transform:translateX(-260%)} }

  /* رسالة عدم الاتصال */
  #offline {
    position:fixed; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:var(--green); color:#fff; text-align:center; padding:24px;
  }
  #offline.show { display:flex; }
  #offline button {
    margin-top:8px; padding:12px 28px; border:0; border-radius:12px;
    background:var(--gold); color:#1d1d1d; font-size:16px; font-weight:700; font-family:inherit;
  }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <h1>منصة رفع البيانات<br>النطاق السابع - 1448هـ</h1>
  <div class="bar"><span></span></div>
  <p>جارِ التحميل…</p>
</div>

<div id="offline">
  <h1 style="font-size:20px">لا يوجد اتصال بالإنترنت</h1>
  <p style="opacity:.85">تحتاج المنصة إلى الإنترنت لرفع الملفات.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>

<div id="app"></div>

<script>
  // ▼▼▼ ضع هنا رابط تطبيق Apps Script المنشور (الذي ينتهي بـ /exec) ▼▼▼
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/ضع_المعرف_هنا/exec";
  // ▲▲▲━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━▲▲▲

  const splash  = document.getElementById("splash");
  const offline = document.getElementById("offline");

  function start() {
    if (!navigator.onLine) { offline.classList.add("show"); splash.classList.add("hide"); return; }

    // تمرير أي معاملات من رابط التطبيق (مثل ?view=log) إلى Apps Script
    const url = new URL(APPS_SCRIPT_URL);
    new URLSearchParams(location.search).forEach((v, k) => url.searchParams.set(k, v));

    const frame = document.createElement("iframe");
    frame.src = url.toString();
    frame.title = "منصة رفع البيانات";
    frame.allow = "camera; microphone; geolocation; clipboard-write; fullscreen";
    frame.addEventListener("load", () => setTimeout(() => splash.classList.add("hide"), 250));
    document.getElementById("app").appendChild(frame);

    // احتياط: إخفاء شاشة البدء بعد 8 ثوانٍ مهما حدث
    setTimeout(() => splash.classList.add("hide"), 8000);
  }

  window.addEventListener("offline", () => offline.classList.add("show"));
  window.addEventListener("online",  () => offline.classList.remove("show"));

  start();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
